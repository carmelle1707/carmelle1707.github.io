<head>

<style>
/* Layout : barre du haut fixe, menu des sections à gauche, formulaire au centre (onglets sur mobile) */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#0f1b2d; --muted:#5b6779; --line:#dde2ea; --soft:#eef1f6;
  --gold:#c99a3e; --gold-ink:#0f1b2d; --second:#2f5d8a; --ok:#1f8a5b; --danger:#b42335; --danger-soft:#fbeaec;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --serif:"Instrument Serif", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#111a2b; --ink:#eef1f6; --muted:#9aa7bb; --line:#223049; --soft:#162238;
  --gold:#d9ad5b; --gold-ink:#0b1220; --second:#8fb3e0; --ok:#45c08a; --danger:#ff6b7d; --danger-soft:#3a1820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#111a2b; --ink:#eef1f6; --muted:#9aa7bb; --line:#223049; --soft:#162238;
  --gold:#d9ad5b; --gold-ink:#0b1220; --second:#8fb3e0; --ok:#45c08a; --danger:#ff6b7d; --danger-soft:#3a1820; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.15}
p{margin:0}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;transition:background .15s, border-color .15s, transform .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-primary:hover{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn-gold:hover{filter:brightness(1.05);border-color:var(--gold)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn-danger{color:var(--danger)}
.btn-danger:hover{border-color:var(--danger)}
.btn-danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--soft);border-color:transparent}

/* Connexion */
.login{min-height:100%;display:grid;place-items:center;padding-block:48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.login-card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;display:grid;gap:20px;box-shadow:0 30px 60px -40px rgba(15,27,45,.45)}
.login-card h1{font-size:30px}
.login-card h1 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--gold)}
.login-card .sub{color:var(--muted)}
.help{background:var(--soft);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--muted)}
.help summary{cursor:pointer;color:var(--ink);font-weight:600}
.help ol{margin:10px 0 0;padding-left:18px;display:grid;gap:6px}
.help code{font-family:var(--mono);font-size:12.5px;background:var(--surface);padding:1px 5px;border-radius:4px;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:14px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* Champs */
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-weight:600;font-size:13.5px}
.field .hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=url],input[type=password],input[type=email],textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px;transition:border-color .15s, background .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);background:var(--surface)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

/* Application */
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar-in{display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.logo{font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap}
.logo span{color:var(--gold)}
.logo small{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.state{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-left:auto;white-space:nowrap}
.state i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.state.dirty i{background:var(--gold)}
.state.dirty{color:var(--ink)}
.bar .actions{display:flex;gap:8px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:0}
.side{border-right:1px solid var(--line);padding:20px 12px;display:grid;align-content:start;gap:2px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:500}
.side button:hover{background:var(--soft);color:var(--ink)}
.side button.on{background:var(--ink);color:var(--bg)}
.side button .count{font-family:var(--mono);font-size:12px;opacity:.8}
.side .sep{height:1px;background:var(--line);margin:12px 8px}
.side .meta{font-size:12.5px;color:var(--muted);padding:4px 12px;overflow-wrap:anywhere}
.side .meta b{color:var(--ink);font-weight:600}
.main{padding:28px max(16px, env(safe-area-inset-right, 0px)) 80px 32px;min-width:0}
.panel{max-width:820px;display:grid;gap:22px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.panel-head h2{font-size:30px}
.panel-head p{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 .full{grid-column:1/-1}
.items{display:grid;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s, box-shadow .2s}
.item[open]{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));box-shadow:0 14px 30px -24px rgba(15,27,45,.45)}
.item summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.item .idx{font-family:var(--mono);font-size:12px;color:var(--muted);width:24px}
.item .ttl{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .thumb{width:44px;height:30px;border-radius:6px;object-fit:cover;background:var(--soft);flex:none}
.item .chev{transition:transform .2s;color:var(--muted)}
.item[open] .chev{transform:rotate(90deg)}
.item .tools{display:flex;gap:4px}
.item-body{padding:4px 16px 18px;display:grid;gap:16px;border-top:1px solid var(--line);padding-top:16px}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:16px;color:var(--muted);font-weight:600;transition:border-color .15s,color .15s}
.add:hover{border-color:var(--gold);color:var(--ink)}
.img-field{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.img-field .pv{width:120px;aspect-ratio:16/10;border-radius:10px;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.img-field .pv.portrait{width:84px;aspect-ratio:4/5}
.img-field .pv-empty{display:grid;place-items:center;font-size:12px;color:var(--muted)}
.img-field .col{display:grid;gap:8px;flex:1;min-width:180px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;font-size:14px;transition:opacity .25s, transform .25s;z-index:20;max-width:calc(100% - 32px);box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#fff}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:6px}
  .side button{width:auto;white-space:nowrap;flex:none}
  .side .sep,.side .meta{display:none}
  .main{padding:20px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px))}
  .grid2,.row2{grid-template-columns:1fr}
  .logo small,.state span{display:none}
}
@media (max-width:520px){.bar .actions .btn-ghost{display:none}}
</style>
</head>

  function b64(str){return btoa(unescape(encodeURIComponent(str)));}
  function unb64(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));}
  function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'fichier';}
  function clone(o){return JSON.parse(JSON.stringify(o));}
  function getPath(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k];},o);}
  function setPath(o,p,v){var ks=p.split('.'),last=ks.pop();var t=ks.reduce(function(a,k){if(a[k]==null)a[k]={};return a[k];},o);t[last]=v;}

  // ---------- GitHub ----------
  function api(path,opt){
    opt=opt||{};
    var c=S.cfg;
    return fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+path,{
      method:opt.method||'GET',
      headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
      body:opt.body?JSON.stringify(opt.body):undefined
    }).then(function(r){
      return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(e){}
        if(!r.ok){var e=new Error((j&&j.message)||('Erreur '+r.status));e.status=r.status;throw e;}return j;});
    });
  }
  function errText(e){
    if(e.status===401) return 'Le jeton GitHub est invalide ou a expiré. Crée un nouveau jeton et reconnecte-toi.';
    if(e.status===403) return "Le jeton n'a pas le droit d'écrire. Vérifie la permission « Contents : Read and write ».";
    if(e.status===404) return 'Dépôt introuvable. Vérifie le nom du compte, du dépôt et de la branche.';
    if(e.status===409) return 'Le fichier a changé entre-temps. Recharge la page puis refais ta modification.';
    if(e.status===422) return 'GitHub a refusé le fichier. Essaie avec un fichier plus léger.';
    if(e instanceof TypeError) return 'Impossible de joindre GitHub. Vérifie ta connexion internet.';
    return e.message;
  }
  function loadRemote(){
    var c=S.cfg;
    return api('').then(function(){
      return api('/contents/content.json?ref='+encodeURIComponent(c.branch)).then(function(j){
        S.content=JSON.parse(unb64(j.content));S.sha=j.sha;
      }).catch(function(e){
        if(e.status===404){S.content=clone(DEFAULT);S.sha=null;S.dirty=true;toast('content.json sera créé à ta première publication.');return;}
        throw e;
      });
    });
  }
  function publish(){
    if(S.demo){toast('Mode démo : connecte ton dépôt GitHub pour publier.',true);return;}
    var btn=document.getElementById('pub');btn.disabled=true;btn.textContent='Publication…';
    var body={message:'Mise à jour du portfolio depuis l’admin',content:b64(JSON.stringify(S.content,null,2)+'\n'),branch:S.cfg.branch};
    if(S.sha) body.sha=S.sha;
    api('/contents/content.json',{method:'PUT',body:body}).then(function(j){
      S.sha=j.content.sha;S.dirty=false;updateState();
      toast('Publié ✓ Ton site sera à jour dans une minute environ.');
    }).catch(function(e){toast(errText(e),true);}).then(function(){btn.disabled=false;btn.textContent='Publier';});
  }
  function upload(file,folder){
    if(S.demo){S.blobs[file.name]=URL.createObjectURL(file);return Promise.resolve(folder+'/'+file.name);}
    if(file.size>8*1024*1024) return Promise.reject(new Error('Fichier trop lourd (8 Mo maximum). Compresse-le avant de l’envoyer.'));
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var data=String(fr.result).split(',')[1];
        var dot=file.name.lastIndexOf('.'),ext=dot>0?file.name.slice(dot).toLowerCase():'';
        var path=folder+'/'+slug(dot>0?file.name.slice(0,dot):file.name)+'-'+Date.now().toString(36)+ext;
        api('/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',body:{message:'Ajout de '+path+' depuis l’admin',content:data,branch:S.cfg.branch}})
          .then(function(){S.blobs[path]=URL.createObjectURL(file);res(path);}).catch(rej);
      };
      fr.onerror=function(){rej(new Error('Lecture du fichier impossible.'));};
      fr.readAsDataURL(file);
    });
  }
  function imgUrl(p){if(!p)return '';if(S.blobs[p])return S.blobs[p];if(/^https?:/.test(p))return p;return encodeURI(p);}

  // ---------- Écran de connexion ----------
  function loginView(msg){
    var c=store(true)||{};
    root.innerHTML='<div class="login"><form class="login-card" id="lf" autocomplete="off">'+
      '<div><h1>Espace <em>admin</em></h1><p class="sub" style="margin-top:6px">Modifie ton portfolio sans toucher au code. Tes changements sont enregistrés sur GitHub et Vercel met le site à jour tout seul.</p></div>'+
      '<div class="row2"><div class="field"><label for="f-owner">Compte GitHub</label><input type="text" id="f-owner" required placeholder="carmelle1707" value="'+esc(c.owner||'carmelle1707')+'"></div>'+
      '<div class="field"><label for="f-repo">Dépôt</label><input type="text" id="f-repo" required placeholder="portfolio" value="'+esc(c.repo||'')+'"></div></div>'+
      '<div class="field"><label for="f-branch">Branche</label><input type="text" id="f-branch" required value="'+esc(c.branch||'main')+'"></div>'+
      '<div class="field"><label for="f-token">Jeton d’accès GitHub</label><input type="password" id="f-token" required placeholder="github_pat_…" value="'+esc(c.token||'')+'"><span class="hint">Il reste dans ton navigateur et n’est envoyé qu’à GitHub.</span></div>'+
      '<label class="check"><span class="switch"><input type="checkbox" id="f-remember"'+(c.remember?' checked':'')+'><span></span></span>Rester connectée sur cet appareil</label>'+
      (msg?'<p class="err" role="alert">'+esc(msg)+'</p>':'')+
      '<button class="btn btn-primary" id="f-go" type="submit">Se connecter</button>'+
      '<div class="or">ou</div><button class="btn" type="button" id="demo">Essayer en mode démo</button>'+
      '<details class="help"><summary>Comment obtenir mon jeton ?</summary><ol>'+
      '<li>Sur GitHub, ouvre <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens</b>.</li>'+
      '<li>Clique sur <b>Generate new token</b>, donne-lui un nom et une date d’expiration.</li>'+
      '<li>Dans <b>Repository access</b>, choisis <b>Only select repositories</b> puis ton dépôt du portfolio.</li>'+
      '<li>Dans <b>Permissions → Contents</b>, choisis <b>Read and write</b>.</li>'+
      '<li>Génère le jeton, copie-le et colle-le ici. Il commence par <code>github_pat_</code>.</li></ol></details>'+
      '</form></div>';
    document.getElementById('lf').addEventListener('submit',function(e){
      e.preventDefault();
      var cfg={owner:val('f-owner'),repo:val('f-repo'),branch:val('f-branch')||'main',token:val('f-token'),remember:document.getElementById('f-remember').checked};
      var b=document.getElementById('f-go');b.disabled=true;b.textContent='Connexion…';
      S.cfg=cfg;S.demo=false;
      loadRemote().then(function(){save(cfg,cfg.remember);appView();}).catch(function(err){loginView(errText(err));});
    });
    document.getElementById('demo').addEventListener('click',function(){S.demo=true;S.cfg={owner:'demo',repo:'portfolio',branch:'main'};S.content=clone(DEFAULT);S.sha=null;appView();});
  }
  function val(id){return document.getElementById(id).value.trim();}

  // ---------- Application ----------
  function appView(){
    root.innerHTML='<div class="app"><header class="bar"><div class="bar-in">'+
      '<div class="logo">Portfolio<span>.</span><small>Admin</small></div>'+
      '<div class="state" id="state"><i></i><span>Tout est publié</span></div>'+
      '<div class="actions"><a class="btn btn-ghost" href="./" target="_blank" rel="noopener">Voir le site ↗</a>'+
      '<button class="btn btn-gold" id="pub">Publier</button></div></div></header>'+
      '<div class="layout"><nav class="side" id="side" aria-label="Sections"></nav><main class="main"><div class="panel" id="panel"></div></main></div></div>';
    document.getElementById('pub').addEventListener('click',publish);
    renderSide();renderPanel();updateState();
  }
  function count(s){var v=S.content[s.id];return (s.kind==='list'||s.kind==='lines')&&Array.isArray(v)?v.length:'';}
  function renderSide(){
    var h='';
    SECTIONS.forEach(function(s){h+='<button type="button" data-sec="'+s.id+'" class="'+(S.section===s.id?'on':'')+'"><span>'+esc(s.label)+'</span><span class="count">'+count(s)+'</span></button>';});
    h+='<div class="sep"></div><p class="meta">'+(S.demo?'<b>Mode démo</b> : rien n’est enregistré.':'Dépôt <b>'+esc(S.cfg.owner+'/'+S.cfg.repo)+'</b> · '+esc(S.cfg.branch))+'</p>';
    h+='<button type="button" id="logout" style="margin-top:6px">'+(S.demo?'Quitter la démo':'Se déconnecter')+'</button>';
    var side=document.getElementById('side');side.innerHTML=h;
    side.querySelectorAll('[data-sec]').forEach(function(b){b.addEventListener('click',function(){S.section=b.dataset.sec;renderSide();renderPanel();window.scrollTo(0,0);});});
    document.getElementById('logout').addEventListener('click',function(){
      if(S.dirty&&!S.demo&&!window.confirm('Tu as des modifications non publiées. Te déconnecter quand même ?'))return;
      if(!S.demo)forget();S={cfg:null,content:null,sha:null,dirty:false,demo:false,section:'profile',open:{},blobs:{}};loginView();
    });
  }
  function updateState(){
    var st=document.getElementById('state');if(!st)return;
    st.className='state'+(S.dirty?' dirty':'');
    st.querySelector('span').textContent=S.demo?'Mode démo':(S.dirty?'Modifications non publiées':'Tout est publié');
  }
  function touch(){S.dirty=true;updateState();}

  function fieldHTML(f,path,v){
    var id='i-'+path.replace(/\./g,'-'),t=f.type||'text',h='<div class="field'+(f.full?' full':'')+'">';
    if(t==='bool') return '<div class="field full"><label class="check"><span class="switch"><input type="checkbox" id="'+id+'" data-path="'+path+'" data-type="bool"'+(v!==false?' checked':'')+'><span></span></span>'+esc(f.label)+'</label></div>';
    h+='<label for="'+id+'">'+esc(f.label)+'</label>';
    if(t==='textarea') h+='<textarea id="'+id+'" data-path="'+path+'" rows="3">'+esc(v)+'</textarea>';
    else if(t==='lines') h+='<textarea id="'+id+'" data-path="'+path+'" data-type="lines" rows="4">'+esc((v||[]).join('\n'))+'</textarea>';
    else if(t==='tags') h+='<input type="text" id="'+id+'" data-path="'+path+'" data-type="tags" value="'+esc((v||[]).join(', '))+'">';
    else if(t==='select') h+='<select id="'+id+'" data-path="'+path+'">'+f.options.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';
    else if(t==='image'||t==='file'){
      h+='<div class="img-field">';
      if(t==='image') h+=(v?'<img class="pv'+(f.portrait?' portrait':'')+'" src="'+esc(imgUrl(v))+'" alt="">':'<div class="pv pv-empty'+(f.portrait?' portrait':'')+'">Aucune image</div>');
      h+='<div class="col"><input type="text" id="'+id+'" data-path="'+path+'" value="'+esc(v)+'" placeholder="'+(t==='image'?'image/mon-projet.png':'mon-cv.pdf')+'">'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="btn btn-sm upl">'+(t==='image'?'Envoyer une image':'Envoyer un PDF')+'<input type="file" data-upload="'+path+'" data-folder="'+(t==='image'?'image':'docs')+'" accept="'+(f.accept||'image/*')+'"></span>'+
        (v?'<button type="button" class="btn btn-sm btn-ghost" data-clear="'+path+'">Retirer</button>':'')+'</div></div></div>';
    }
    else h+='<input type="'+(t==='url'?'url':t==='email'?'email':'text')+'" id="'+id+'" data-path="'+path+'" value="'+esc(v)+'">';
    if(f.hint) h+='<span class="hint">'+esc(f.hint)+'</span>';
    return h+'</div>';
  }
  function renderPanel(){
    var s=sec(S.section),c=S.content,h='';
    if(S.demo) h+='<div class="banner">Mode démo : tu peux tout essayer, mais rien n’est enregistré. Connecte ton dépôt GitHub pour publier.</div>';
    h+='<div class="panel-head"><div><h2>'+esc(s.label)+'</h2><p>'+esc(s.desc)+'</p></div></div>';
    if(s.kind==='object'){
      h+='<div class="card"><div class="grid2">'+s.fields.map(function(f){return fieldHTML(f,s.id+'.'+f.k,getPath(c,s.id+'.'+f.k));}).join('')+'</div></div>';
    } else if(s.kind==='lines'){
      h+='<div class="card">'+fieldHTML({label:'Mots du bandeau',type:'lines',full:1,hint:'Un mot ou une expression par ligne.'},s.id,c[s.id]||[])+'</div>';
    } else {
      var list=c[s.id]||(c[s.id]=[]);
      h+='<div class="items">';
      if(!list.length) h+='<div class="empty">Aucun élément pour le moment.</div>';
      list.forEach(function(it,i){
        var key=s.id+'.'+i,open=S.open[s.id]===i;
        h+='<details class="item"'+(open?' open':'')+' data-i="'+i+'"><summary><span class="idx">'+(i+1)+'</span>'+
          (s.thumbKey?(it[s.thumbKey]?'<img class="thumb" src="'+esc(imgUrl(it[s.thumbKey]))+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<span class="thumb"></span>'):'')+
          '<span class="ttl" data-ttl="'+key+'">'+esc(it[s.titleKey]||'Sans titre')+'</span>'+
          '<span class="tools"><button type="button" class="btn btn-sm btn-ghost" data-act="up" data-i="'+i+'" aria-label="Monter"'+(i===0?' disabled':'')+'>↑</button>'+
          '<button type="button" class="btn btn-sm btn-ghost" data-act="down" data-i="'+i+'" aria-label="Descendre"'+(i===list.length-1?' disabled':'')+'>↓</button>'+
          '<button type="button" class="btn btn-sm btn-danger" data-act="del" data-i="'+i+'">Supprimer</button></span>'+
          '<span class="chev" aria-hidden="true">›</span></summary>'+
          '<div class="item-body"><div class="grid2">'+s.fields.map(function(f){return fieldHTML(f,key+'.'+f.k,it[f.k]);}).join('')+'</div></div></details>';
      });
      h+='</div><button type="button" class="add" id="add">+ Ajouter '+esc(s.noun)+'</button>';
    }
    var old=document.getElementById('panel'),panel=old.cloneNode(false);old.replaceWith(panel);panel.innerHTML=h;
    bindPanel(panel,s);
  }
  function bindPanel(panel,s){
    panel.addEventListener('input',function(e){
      var el=e.target,p=el.dataset.path;if(!p)return;
      var t=el.dataset.type,v;
      if(t==='bool')v=el.checked;
      else if(t==='lines')v=el.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      else if(t==='tags')v=el.value.split(',').map(function(x){return x.trim();}).filter(Boolean);
      else v=el.value;
      setPath(S.content,p,v);touch();
      var ttl=panel.querySelector('[data-ttl="'+p.replace(/\.[^.]+$/,'')+'"]');
      if(ttl&&s.titleKey&&p.slice(-s.titleKey.length-1)==='.'+s.titleKey)ttl.textContent=v||'Sans titre';
      if(s.kind!=='object')renderSideCounts();
    });
    panel.addEventListener('change',function(e){
      var el=e.target;
      if(el.dataset.type==='bool'){setPath(S.content,el.dataset.path,el.checked);touch();}
      if(el.dataset.upload&&el.files&&el.files[0]){
        var f=el.files[0],path=el.dataset.upload;
        toast('Envoi de « '+f.name+' »…');
        upload(f,el.dataset.folder).then(function(p){setPath(S.content,path,p);touch();rememberOpen(panel,s);renderPanel();toast(S.demo?'Image ajoutée (démo, non enregistrée).':'Fichier envoyé ✓ Pense à publier.');})
          .catch(function(err){toast(errText(err),true);});
      }
    });
    panel.addEventListener('toggle',function(e){var d=e.target;if(d.matches&&d.matches('details.item')&&d.open)S.open[s.id]=+d.dataset.i;},true);
    panel.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.clear){setPath(S.content,b.dataset.clear,'');touch();rememberOpen(panel,s);renderPanel();return;}
      if(b.id==='add'){var list=S.content[s.id];list.push(clone(s.blank));S.open[s.id]=list.length-1;touch();renderPanel();renderSideCounts();
        var last=panel.querySelector('details.item:last-of-type');if(last){last.scrollIntoView({behavior:'smooth',block:'center'});var inp=last.querySelector('input,textarea');if(inp)inp.focus({preventScroll:true});}return;}
      var act=b.dataset.act;if(!act)return;
      e.preventDefault();e.stopPropagation();
      var i=+b.dataset.i,L=S.content[s.id];
      if(act==='del'){
        if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmer';setTimeout(function(){if(b.isConnected){b.classList.remove('armed');b.textContent='Supprimer';}},3500);return;}
        L.splice(i,1);S.open[s.id]=-1;toast('Élément supprimé. Pense à publier.');
      } else {
        var j=act==='up'?i-1:i+1;if(j<0||j>=L.length)return;
        var tmp=L[i];L[i]=L[j];L[j]=tmp;if(S.open[s.id]===i)S.open[s.id]=j;else if(S.open[s.id]===j)S.open[s.id]=i;
      }
      touch();renderPanel();renderSideCounts();
    });
  }
  function rememberOpen(panel,s){var d=panel.querySelector('details.item[open]');S.open[s.id]=d?+d.dataset.i:-1;}
  function renderSideCounts(){document.querySelectorAll('#side [data-sec]').forEach(function(b){b.querySelector('.count').textContent=count(sec(b.dataset.sec));});}

  window.addEventListener('beforeunload',function(e){if(S.dirty&&!S.demo){e.preventDefault();e.returnValue='';}});

  // ---------- Démarrage ----------
  var saved=store(true);
  if(saved&&saved.token){
    S.cfg=saved;
    root.innerHTML='<div class="login"><p class="sub">Connexion à GitHub…</p></div>';
    loadRemote().then(appView).catch(function(e){loginView(errText(e));});
  } else loginView();
})();
</script>
</body>
</html>
