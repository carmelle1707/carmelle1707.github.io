<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ange Carmelle Gbedji</title>
<meta name="description" content="Ange Carmelle Gbedji, développeuse web et mobile freelance à Abidjan. Sites vitrines, applications web et applications mobiles pour PME, commerces et startups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : colonne 1120px, bandes bleu nuit, accents dorés, projets empilés au scroll */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#0f1b2d; --muted:#556275; --line:#dde2ea;
  --accent:#a8761f; --accent-ink:#0f1b2d; --gold:#d2a44a; --second:#2f5d8a;
  --band:#0f1b2d; --band-ink:#eef1f6; --band-muted:#9aa7bb; --band-dim:#26354d; --grain:.045;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px; --ease:cubic-bezier(.2,.7,.2,1); --ease-io:cubic-bezier(.76,0,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#111a2b; --ink:#eef1f6; --muted:#9aa7bb; --line:#223049;
  --accent:#d9ad5b; --accent-ink:#0b1220; --gold:#d9ad5b; --second:#8fb3e0;
  --band:#0f1a2e; --band-ink:#eef1f6; --band-muted:#9aa7bb; --band-dim:#26354d; --grain:0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#111a2b; --ink:#eef1f6; --muted:#9aa7bb; --line:#223049;
  --accent:#d9ad5b; --accent-ink:#0b1220; --gold:#d9ad5b; --second:#8fb3e0;
  --band:#0f1a2e; --band-ink:#eef1f6; --band-muted:#9aa7bb; --band-dim:#26354d; --grain:0; color-scheme:dark}
.band{--accent:var(--gold)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
::selection{background:var(--gold);color:#0f1b2d}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--second)}
.band .eyebrow{color:var(--gold)}
section{padding-block:96px}
.sec-head{display:grid;gap:12px;margin-bottom:48px;max-width:660px}
.sec-head h2{font-size:clamp(34px,4.8vw,52px);font-weight:800}
.sec-head p{color:var(--muted)}
h1 em,h2 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}
em .wi{padding-right:.05em}

.grain{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:var(--grain);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;width:100%;height:3px;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);z-index:12;pointer-events:none}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s, transform .45s var(--ease-io)}
header.top.scrolled{border-bottom-color:var(--line)}
header.top.hide{transform:translateY(-110%)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;letter-spacing:-.02em}
.brand span{color:var(--gold);display:inline-block;transition:transform .5s var(--ease)}
.brand:hover span{transform:translateY(-6px) scale(1.4)}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-size:15px}
.nav ul a{position:relative;text-decoration:none;color:var(--muted);transition:color .2s}
.nav ul a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
.nav ul a:hover::after,.nav ul a.active::after{transform:scaleX(1);transform-origin:left}
.nav ul a:hover,.nav ul a.active{color:var(--ink)}
@media (max-width:820px){.nav ul{display:none}}

/* Boutons */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;transition:color .35s var(--ease), border-color .35s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;transform:translateY(101%);transition:transform .5s var(--ease-io)}
.btn:hover::before{transform:none}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary::before{background:var(--gold)}
.btn-primary:hover{color:#0f1b2d}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.btn-ghost::before{background:var(--ink)}
.btn-ghost:hover{color:var(--bg);border-color:var(--ink)}
.nav .btn{padding:10px 18px}
.arr{display:inline-block;transition:transform .35s var(--ease)}
.btn:hover .arr,.channel:hover .arr{transform:translateX(5px)}
.magnetic{will-change:transform}

/* Hero */
.hero{position:relative;padding-block:72px 96px;overflow:clip}
.glow{position:absolute;width:700px;height:700px;left:50%;top:40%;margin:-350px 0 0 -350px;border-radius:50%;pointer-events:none;z-index:-1;filter:blur(30px);
  background:radial-gradient(circle at 35% 40%, color-mix(in srgb,var(--gold) 22%,transparent), transparent 55%),radial-gradient(circle at 65% 60%, color-mix(in srgb,var(--second) 20%,transparent), transparent 55%);
  animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{scale:1.12;rotate:25deg}}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center}
.status{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;padding:6px 14px 6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.dot{width:9px;height:9px;border-radius:50%;background:#2e9b6a;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,155,106,.5)}75%,100%{box-shadow:0 0 0 11px rgba(46,155,106,0)}}
.hero h1{font-size:clamp(42px,6.6vw,80px);font-weight:800;margin-top:22px}
.hero h1 em{background:linear-gradient(color-mix(in srgb,var(--gold) 26%,transparent),color-mix(in srgb,var(--gold) 26%,transparent)) 0 88% / 0% .28em no-repeat;animation:sweep 1s var(--ease-io) 1.3s forwards}
@keyframes sweep{to{background-size:100% .28em}}
.hero .lead{font-size:clamp(18px,2vw,20px);color:var(--muted);max-width:56ch;margin-top:22px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.portrait{position:relative}
.photo{aspect-ratio:4/5;max-width:100%;width:100%;border-radius:22px;overflow:hidden;background:linear-gradient(150deg,#1d3352,#0f1b2d);display:grid;place-items:center;animation:unveil 1.3s var(--ease-io) .2s both}
.photo img{width:100%;height:115%;object-fit:cover;display:block;animation:settle 2s var(--ease) .2s both}
.photo .initials{font-family:var(--serif);font-style:italic;font-size:110px;color:#d2a44a}
@keyframes unveil{from{clip-path:inset(100% 0 0 0 round 22px)}to{clip-path:inset(0 0 0 0 round 22px)}}
@keyframes settle{from{transform:scale(1.25)}to{transform:scale(1)}}
.fiche{position:absolute;left:-32px;bottom:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.75;box-shadow:0 18px 40px -18px rgba(15,27,45,.45);animation:pop .9s var(--ease) 1.1s both}
@keyframes pop{from{opacity:0;transform:translate(-30px,10px) rotate(-4deg)}to{opacity:1;transform:none}}
.fiche b{color:var(--muted);font-weight:400;display:inline-block;width:76px}
.fiche .live{color:var(--accent);font-variant-numeric:tabular-nums}
.badge{position:absolute;right:-22px;top:-22px;width:112px;height:112px;animation:spin 18s linear infinite, fade .8s ease 1.4s both}
.badge .disc{fill:var(--surface);stroke:var(--line)}
.badge text{font-family:var(--mono);font-size:10.6px;letter-spacing:.16em;fill:var(--ink);text-transform:uppercase}
.badge .core{fill:var(--gold)}
@keyframes spin{to{rotate:360deg}}
@keyframes fade{from{opacity:0}}
.scroll-hint{display:flex;align-items:center;gap:10px;margin-top:56px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.scroll-hint i{width:1px;height:38px;background:var(--line);position:relative;overflow:hidden}
.scroll-hint i::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--gold);animation:drip 1.8s var(--ease-io) infinite}
@keyframes drip{to{top:100%}}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr;gap:44px}.portrait{max-width:340px}.fiche{left:12px}.badge{right:-10px;width:92px;height:92px}.scroll-hint{display:none}}

.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.wi{display:inline-block;transition:transform 1s var(--ease);transition-delay:calc(var(--wi,0) * 55ms + var(--wd,0ms))}
.split-wait .wi{transform:translateY(115%) rotate(4deg)}
.fade-up{animation:rise .9s var(--ease) both;animation-delay:var(--dl)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* Bandeau */
.marquee{border-block:1px solid var(--line);padding-block:22px;overflow:hidden;display:grid;gap:10px;background:var(--surface)}
.track{display:flex;width:max-content;animation:slide 32s linear infinite}
.track.rev{animation-direction:reverse;animation-duration:40s}
.marquee:hover .track{animation-play-state:paused}
.track span{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,60px);letter-spacing:-.02em;white-space:nowrap;padding-right:.5em;display:inline-flex;align-items:center;gap:.5em}
.track span::after{content:"✦";font-size:.45em;color:var(--gold)}
.track span:nth-child(even){color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.track.rev span{font-family:var(--mono);font-weight:500;font-size:clamp(14px,1.6vw,17px);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);-webkit-text-stroke:0}
.track.rev span::after{color:var(--second)}
.skew{transition:transform .4s var(--ease);will-change:transform}
@keyframes slide{to{transform:translateX(-50%)}}

/* Services */
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;perspective:1000px}
.svc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0;transform-style:preserve-3d;transition:transform .5s var(--ease), border-color .35s, box-shadow .35s}
.svc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(420px circle at var(--gx,50%) var(--gy,50%), color-mix(in srgb,var(--gold) 16%,transparent), transparent 45%)}
.svc:hover{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));box-shadow:0 30px 60px -36px rgba(15,27,45,.5)}
.svc:hover::after{opacity:1}
.svc h3{font-size:25px;font-weight:700}
.svc p{color:var(--muted);font-size:16px}
.svc ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:15px}
.svc li{display:flex;gap:10px}
.svc li::before{content:"";flex:none;width:6px;height:6px;margin-top:9px;border-radius:2px;background:var(--gold);transition:transform .4s var(--ease)}
.svc:hover li::before{transform:rotate(45deg) scale(1.3)}
.svc .for{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.svc .for strong{color:var(--ink);font-weight:600}
.svc .icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--second) 12%,transparent);color:var(--second);transition:transform .5s var(--ease), background .3s, color .3s}
.svc:hover .icon{transform:rotate(-8deg) scale(1.08);background:var(--ink);color:var(--gold)}
.svc .icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:900px){.services{grid-template-columns:1fr}}

/* Méthode */
.band{background:var(--band);color:var(--band-ink)}
.band .sec-head p{color:var(--band-muted)}
.steps-wrap{position:relative;padding-top:28px}
.rail{position:absolute;left:0;right:0;top:0;height:2px;background:var(--band-dim);border-radius:2px;overflow:hidden}
.rail i{position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(var(--p,0))}
.steps{display:grid;grid-template-columns:repeat(var(--n,4),1fr);list-style:none;margin:0;padding:0}
.steps li{position:relative;padding-right:24px;display:grid;gap:10px;align-content:start;min-width:0}
.steps li::before{content:"";position:absolute;top:-35px;left:0;width:14px;height:14px;border-radius:50%;background:var(--band);border:2px solid var(--band-dim);transition:background .4s, border-color .4s, transform .4s var(--ease)}
.steps li.on::before{background:var(--gold);border-color:var(--gold);transform:scale(1.25)}
.steps .n{font-family:var(--mono);font-size:14px;color:var(--band-muted);transition:color .4s}
.steps li.on .n{color:var(--gold)}
.steps h3{font-size:23px;font-weight:700}
.steps p{color:var(--band-muted);font-size:15.5px}
@media (max-width:860px){.rail{display:none}.steps-wrap{padding-top:0}.steps{grid-template-columns:1fr 1fr;row-gap:40px}.steps li::before{display:none}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

/* Projets */
.projects{display:grid;gap:28px}
.proj{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:22px;transform-origin:50% 0;box-shadow:0 -10px 40px -30px rgba(15,27,45,.4)}
@media (min-width:861px) and (min-height:700px){.proj{position:sticky;top:calc(96px + var(--i) * 18px)}}
.proj:nth-child(even) .shot{order:2}
.shot{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:14px;overflow:hidden;background:linear-gradient(140deg,color-mix(in srgb,var(--second) 14%,var(--bg)),color-mix(in srgb,var(--gold) 14%,var(--bg)));display:grid;place-items:center;border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform 1s var(--ease)}
.proj:hover .shot img{transform:scale(1.06)}
.shot .ph{font-family:var(--serif);font-style:italic;font-size:clamp(34px,4.4vw,54px);color:var(--ink);opacity:.6;transition:transform 1s var(--ease)}
.proj:hover .shot .ph{transform:scale(1.08)}
.proj-body{display:grid;gap:14px;min-width:0}
.tag{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.proj h3{font-size:clamp(26px,3vw,36px);font-weight:800}
.proj p{color:var(--muted)}
.role{font-size:15px;color:var(--ink)!important}
.role strong{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{font-family:var(--mono);font-size:12.5px;padding:4px 10px;border-radius:6px;background:color-mix(in srgb,var(--second) 10%,transparent);color:var(--second);transition:background .2s, transform .3s var(--ease)}
.chips li:hover{background:color-mix(in srgb,var(--second) 22%,transparent);transform:translateY(-3px)}
.links{display:flex;flex-wrap:wrap;gap:18px;font-weight:600;font-size:15px}
.links a{text-decoration:none;padding-bottom:2px;background:linear-gradient(var(--gold),var(--gold)) 0 100% / 100% 2px no-repeat;transition:background-size .45s var(--ease)}
.links a:hover{background-size:0% 2px;background-position:100% 100%}
@media (max-width:860px){.proj{grid-template-columns:1fr;gap:22px;padding:18px}.proj:nth-child(even) .shot{order:0}}

/* Compétences + parcours */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.stack{display:grid;gap:22px;margin:0}
.stack-row{display:grid;grid-template-columns:110px 1fr;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.stack-row:last-child{border-bottom:0}
.stack-row dt{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:4px}
.stack-row dd{margin:0;min-width:0}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:26px}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:16px}
.timeline time{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:3px;font-variant-numeric:tabular-nums}
.timeline h3{font-size:19px;font-weight:700;font-family:var(--body);letter-spacing:0}
.timeline p{color:var(--muted);font-size:15.5px;margin-top:4px}
@media (max-width:860px){.two{grid-template-columns:1fr;gap:64px}}
@media (max-width:420px){.stack-row,.timeline li{grid-template-columns:1fr;gap:6px}}

/* Contact */
.contact-box{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:end}
.contact h2{font-size:clamp(40px,6.4vw,76px);font-weight:800;margin-top:14px;color:transparent;
  background:linear-gradient(90deg,var(--band-ink) 50%,var(--band-dim) 50%) 0 0 / 200% 100% no-repeat;background-position-x:calc(100% - var(--f,0) * 100%);-webkit-background-clip:text;background-clip:text}
.contact h2 em{-webkit-text-fill-color:var(--gold);color:var(--gold)}
.contact .lead{color:var(--band-muted);margin-top:18px;max-width:46ch}
.channels{display:grid;gap:12px}
.channel{position:relative;overflow:hidden;isolation:isolate;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;border:1px solid color-mix(in srgb,var(--band-ink) 18%,transparent);border-radius:var(--r);text-decoration:none;transition:color .4s var(--ease), border-color .4s}
.channel::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--band-ink);transform:scaleX(0);transform-origin:right;transition:transform .55s var(--ease-io)}
.channel:hover::before{transform:scaleX(1);transform-origin:left}
.channel:hover{color:var(--band);border-color:var(--band-ink)}
.channel span{font-family:var(--mono);font-size:13px;color:var(--band-muted);overflow-wrap:anywhere;text-align:right;transition:color .4s}
.channel:hover span{color:var(--band)}
.channel strong{font-weight:600;display:inline-flex;gap:8px;align-items:center}
.channel.main{background:var(--gold);color:#0f1b2d;border-color:var(--gold)}
.channel.main span{color:#0f1b2d;opacity:.8}
@media (max-width:860px){.contact-box{grid-template-columns:1fr}}
footer{padding-block:28px;font-size:14px;color:var(--band-muted);background:var(--band);border-top:1px solid color-mix(in srgb,var(--band-ink) 12%,transparent)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer a{color:var(--band-ink);text-decoration:none}

.js .reveal{opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease), transform 1s var(--ease);transition-delay:calc(var(--d,0) * 120ms)}
.js .reveal.in{opacity:1;transform:none}
.js .proj.reveal .shot{clip-path:inset(0 100% 0 0 round 14px);transition:clip-path 1.2s var(--ease-io) .2s}
.js .proj.reveal.in .shot{clip-path:inset(0 0 0 0 round 14px)}

/* Curseur */
.cursor,.cursor-dot{position:fixed;left:0;top:0;pointer-events:none;z-index:60;border-radius:50%;display:none}
.cursor{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid var(--gold);place-items:center;transition:width .35s var(--ease), height .35s var(--ease), margin .35s var(--ease), background .35s, border-color .35s}
.cursor-dot{width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--gold)}
.cursor b{font-family:var(--mono);font-size:12px;font-weight:500;color:#0f1b2d;opacity:0;transition:opacity .2s;letter-spacing:.06em;text-transform:uppercase}
.cursor.link{width:64px;height:64px;margin:-32px 0 0 -32px;background:color-mix(in srgb,var(--gold) 18%,transparent);border-color:transparent}
.cursor.view{width:88px;height:88px;margin:-44px 0 0 -44px;background:var(--gold);border-color:var(--gold)}
.cursor.view b{opacity:1}
.has-cursor .cursor{display:grid}
.has-cursor .cursor-dot{display:block}
.cursor.hidden,.cursor-dot.hidden{opacity:0}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hero h1 em{background-size:100% .28em}
  .contact h2{--f:1}
  .progress,.grain{display:none}
}

    function frame(){
      ticking=false;
      var y=scrollY, h=innerHeight, max=document.documentElement.scrollHeight-h;
      bar.style.transform='scaleX('+(max>0?clamp(y/max,0,1):0)+')';
      header.classList.toggle('scrolled',y>8);
      if(y>lastY+4&&y>500) header.classList.add('hide'); else if(y<lastY-4) header.classList.remove('hide');
      vel=y-lastY;lastY=y;
      if(skew) skew.style.transform='skewX('+clamp(-vel*.25,-8,8)+'deg)';
      para.forEach(function(el){el.style.translate='0 '+(y*parseFloat(el.dataset.speed)).toFixed(1)+'px';});
      if(stepsWrap&&rail){
        var r=stepsWrap.getBoundingClientRect(), pr=clamp((h*.8-r.top)/(r.height+h*.3),0,1);
        rail.style.setProperty('--p',pr.toFixed(3));
        steps.forEach(function(li,i){li.classList.toggle('on',pr>=i/steps.length+.02||(r.top<h*.6&&innerWidth<=860));});
      }
      if(wide.matches){
        projs.forEach(function(card,i){
          var next=projs[i+1];if(!next){card.style.transform='';card.style.filter='';return;}
          var a=card.getBoundingClientRect(),b=next.getBoundingClientRect(),t=clamp((a.bottom-b.top)/a.height,0,1);
          card.style.transform='scale('+(1-t*.07).toFixed(4)+')';card.style.filter='brightness('+(1-t*.14).toFixed(3)+')';
        });
      } else projs.forEach(function(card){card.style.transform='';card.style.filter='';});
      if(contactH){var cc=contactH.getBoundingClientRect();contactH.style.setProperty('--f',clamp((h*.95-cc.top)/(h*.55),0,1).toFixed(3));}
    }
    addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(frame);}},{passive:true});
    addEventListener('resize',frame);frame();
    setInterval(function(){if(skew&&Math.abs(vel)<1)skew.style.transform='skewX(0deg)';vel*=.5;},120);

    if(!fine) return;
    root.classList.add('has-cursor');
    var ring=document.querySelector('.cursor'),dot=document.querySelector('.cursor-dot');
    var mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
    addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.transform='translate('+mx+'px,'+my+'px)';ring.classList.remove('hidden');dot.classList.remove('hidden');});
    document.addEventListener('mouseleave',function(){ring.classList.add('hidden');dot.classList.add('hidden');});
    (function loop(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.transform='translate('+rx+'px,'+ry+'px)';requestAnimationFrame(loop);})();
    document.addEventListener('mouseover',function(e){var v=e.target.closest('[data-cursor="view"]'),l=e.target.closest('a,button');ring.classList.toggle('view',!!v);ring.classList.toggle('link',!v&&!!l);});
    var glow=document.querySelector('.glow'),hero=document.querySelector('.hero');
    if(hero) hero.addEventListener('mousemove',function(e){var r=hero.getBoundingClientRect();glow.style.translate=((e.clientX-r.left-r.width/2)*.12)+'px '+((e.clientY-r.top-r.height/2)*.12)+'px';});
    $('.magnetic').forEach(function(b){
      b.addEventListener('mousemove',function(e){var r=b.getBoundingClientRect();b.style.transform='translate('+((e.clientX-r.left-r.width/2)*.28)+'px,'+((e.clientY-r.top-r.height/2)*.38)+'px)';});
      b.addEventListener('mouseleave',function(){b.style.transition='transform .6s cubic-bezier(.2,.7,.2,1), color .35s, border-color .35s';b.style.transform='';setTimeout(function(){b.style.transition='';},600);});
    });
    $('.tilt').forEach(function(c){
      c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
        c.style.transition='transform .15s ease-out, border-color .35s, box-shadow .35s';
        c.style.transform='rotateX('+((.5-py)*10).toFixed(2)+'deg) rotateY('+((px-.5)*12).toFixed(2)+'deg) translateZ(10px)';
        c.style.setProperty('--gx',(px*100)+'%');c.style.setProperty('--gy',(py*100)+'%');});
      c.addEventListener('mouseleave',function(){c.style.transition='';c.style.transform='';});
    });
  }
})();
</script>
</body>
</html>
