<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--head-->
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Figtree:wght@400;700&family=JetBrains+Mono:wght@400&display=swap"
    />
    <script>
      // Écran de démarrage CARMELLE.EXE : une fois par session, jamais si l'on a demandé moins d'animations.
      try {
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches && !sessionStorage.getItem("carmelle-boot")) {
          document.documentElement.dataset.boot = "1";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
