<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--head-->
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Figtree:wght@400;700&family=JetBrains+Mono:wght@400&display=swap"
    />
    <script>
      // Avant le premier affichage : de quoi éviter un éclair de contenu animé ou une tour qui disparaît.
      (function () {
        var root = document.documentElement;
        try {
          var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
          root.classList.add("js");
          if (!reduce) root.classList.add("motion-ok");
          // Même décision que src/lib/capabilities.ts : la tour en 3D, ou son image fixe.
          var gl = document.createElement("canvas");
          var ok = !/[?&]fixe\b/.test(location.search) && !!(gl.getContext("webgl2") || gl.getContext("webgl"));
          var conn = navigator.connection;
          if (ok && !(conn && conn.saveData) && (navigator.hardwareConcurrency || 4) >= 4 && (location.pathname === "/" || location.pathname.indexOf("/projets/") === 0))
            root.classList.add("scene-3d");
          // Écran de démarrage CARMELLE.EXE : une fois par session, jamais si l'on a demandé moins d'animations.
          if (location.pathname === "/" && !reduce && !sessionStorage.getItem("carmelle-boot")) root.dataset.boot = "1";
        } catch (e) {}
        // Filet de sécurité : si l'application ne démarre pas, tout le texte s'affiche normalement.
        setTimeout(function () {
          if (!root.dataset.ready) {
            root.classList.remove("js", "motion-ok");
            delete root.dataset.boot;
          }
        }, 5000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
